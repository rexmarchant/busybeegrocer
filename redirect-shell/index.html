<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BusyBeeGrocer has moved</title>
    <meta name="theme-color" content="#2a78d6" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      body {
        margin: 0; min-height: 100svh; display: flex; align-items: center; justify-content: center;
        background: #e7e5df; color: #0b0b0b; text-align: center; padding: 1.5rem;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; line-height: 1.6;
      }
      .box { max-width: 26rem; }
      img { width: 88px; height: 88px; border-radius: 22px; }
      h1 { font-size: 1.5rem; margin: 1rem 0 0.5rem; }
      p { color: #52514e; margin: 0 0 1.25rem; }
      a.go {
        display: inline-block; background: #2a78d6; color: #fff; text-decoration: none;
        font-weight: 600; padding: 0.85rem 2rem; border-radius: 999px;
      }
      small { display: block; margin-top: 1.5rem; color: #898781; font-size: 0.85rem; }
    </style>
    <script>
      // Anyone who still has the old copy on their home screen lands here. Send
      // them on automatically, but leave the button and the explanation for the
      // case where the redirect is blocked or they arrived deliberately.
      setTimeout(function () {
        window.location.replace('https://busybeegrocer.com/app/')
      }, 2500)
    </script>
  </head>
  <body>
    <div class="box">
      <img src="./icons/icon-192.png" alt="" />
      <h1>BusyBeeGrocer has a new home</h1>
      <p>It now lives at <strong>busybeegrocer.com</strong>. Taking you there…</p>
      <a class="go" href="https://busybeegrocer.com/app/">Go to BusyBeeGrocer</a>
      <small>
        If you added the old version to your home screen, remove it and add the new one from
        busybeegrocer.com — your lists are all still there, waiting for you to sign in.
      </small>
    </div>
  </body>
</html>
