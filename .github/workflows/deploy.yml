name: Deploy to Netlify

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

      # Bumps app/package.json's version based on Conventional Commits since the
      # last release (fix: -> patch, feat: -> minor, "BREAKING CHANGE:" -> major)
      # and pushes that bump back to main -- [skip ci] in its commit message
      # stops that push from re-triggering this workflow. Commits that don't
      # follow the convention just don't trigger a bump; the step still
      # succeeds either way, and the rest of the build proceeds unaffected.
      #
      # This runs *before* the build on purpose: the build reads the version it
      # writes, so the deployed app reports the release it actually is.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: build_number
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # Vite writes to ../dist/app, matching the path it is served from.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILD_NUMBER: ${{ steps.build_number.outputs.count }}
          # Publishable by design -- it only permits sending events, not reading
          # them. Kept as a secret purely so local builds stay console-only.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # The landing page, plus _redirects and _headers, which Netlify only reads
      # from the root of the published directory. Copied after the build because
      # Vite clears dist/app.
      - name: Assemble the deploy directory
        run: cp -r ../site/. ../dist/

      - name: Verify the deploy directory looks right
        run: |
          test -f ../dist/index.html || { echo "landing page missing"; exit 1; }
          test -f ../dist/_redirects || { echo "_redirects missing"; exit 1; }
          test -f ../dist/_headers   || { echo "_headers missing"; exit 1; }
          test -f ../dist/app/index.html || { echo "app missing"; exit 1; }
          test -f ../dist/app/manifest.webmanifest || { echo "manifest missing"; exit 1; }

      # Deploying a pre-built directory rather than letting Netlify build:
      # semantic-release has to bump the version before the build, and Netlify's
      # own Git integration would build the pre-bump commit and then skip the
      # release commit entirely because of its [skip ci] marker. It also means
      # no Netlify build minutes are consumed.
      - name: Deploy to Netlify
        run: >
          npx netlify-cli@latest deploy --prod --dir ../dist
          --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
