name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

      # Bumps app/package.json's version based on Conventional Commits since the
      # last release (fix: -> patch, feat: -> minor, "BREAKING CHANGE:" -> major)
      # and pushes that bump back to main -- [skip ci] in its commit message
      # stops that push from re-triggering this workflow. Commits that don't
      # follow the convention just don't trigger a bump; the step still
      # succeeds either way, and the rest of the build proceeds unaffected.
      #
      # This runs *before* the build on purpose: the build reads the version it
      # writes, so the deployed app reports the release it actually is.
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: build_number
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      # Vite writes to ../dist/app, matching the path it is served from.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_BUILD_NUMBER: ${{ steps.build_number.outputs.count }}
          # Publishable by design -- it only permits sending events, not reading
          # them. Kept as a secret purely so local builds stay console-only.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # The landing page, plus _redirects and _headers, which are only read from
      # the root of the published directory. Copied after the build because Vite
      # clears dist/app.
      # Copies the landing page over the built app, writes the SPA shell, and
      # generates the routing rules from App.tsx. Running the same script
      # locally produces a byte-identical directory, so `wrangler pages dev
      # ../dist` tests exactly what gets published.
      - name: Assemble the deploy directory
        run: npm run assemble

      - name: Verify the deploy directory looks right
        run: |
          test -f ../dist/index.html || { echo "landing page missing"; exit 1; }
          test -f ../dist/_redirects || { echo "_redirects missing"; exit 1; }
          test -f ../dist/_headers   || { echo "_headers missing"; exit 1; }
          test -f ../dist/app/index.html || { echo "app missing"; exit 1; }
          test -f ../dist/app/manifest.webmanifest || { echo "manifest missing"; exit 1; }
          test -f ../dist/app-shell.html || { echo "SPA shell missing"; exit 1; }
          test -f ../dist/app/404.html || { echo "SPA safety net missing"; exit 1; }
          test -f ../dist/404.html || { echo "site 404 page missing"; exit 1; }
          # A shell that lost its script tag would serve a blank page on every
          # deep link, and nothing else here would notice.
          grep -q 'src="/app/assets/' ../dist/app-shell.html || { echo "SPA shell has no app bundle"; exit 1; }
          # A catch-all rewrite parses perfectly well and silently serves HTML
          # for every script and the service worker, so reject one outright.
          # The generator refuses to emit one; this catches a hand edit.
          grep -qE '^/app/\*[[:space:]]' ../dist/_redirects && { echo "catch-all /app/* rewrite would shadow assets"; exit 1; }
          # An empty rules block would mean every deep link falls back to a 404
          # status, which is easy to miss because the app still loads.
          grep -qE '^/app/' ../dist/_redirects || { echo "no SPA rules were generated"; exit 1; }
          true

      # A direct upload rather than letting the host build from Git.
      # semantic-release has to bump the version before the build runs, and a
      # Git-connected host would build the pre-bump commit and then skip the
      # release commit entirely because of its [skip ci] marker -- deploying an
      # app that misreports its own version.
      #
      # --branch main marks this as the production deployment; anything else
      # would land on a preview URL instead.
      - name: Deploy to Cloudflare Pages
        run: >
          npx wrangler@4 pages deploy ../dist
          --project-name busybeegrocer
          --branch main
          --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
